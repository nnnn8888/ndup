    <section>

    <h1>Démo de quelques projets personnels</h1>

                    <button class="btn btn-primary" onclick="window.location.href='/ndup/whale-effect/index.html';">The Whale Effect</button><br><br>

        </div>
        </div>

    <section>
        
        <div class="container">
            <div class="row">
                <div class="col-sm-6 col-sm-offset-3">
                    <div class="well formbl" style="margin-top: 10%;">
                    <p>Formulaire de contact</p>

                    <form role="form" id="formcontact" class="shake">
                        <div class="row">
                            <div class="form-group col-sm-6">
                                <label for="name" >Nom</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Votre nom" required data-error="le nom est requis">
                                
                            </div>
                            <div class="form-group col-sm-6">
                                <label for="email" >Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Votre email" required>
                               
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="message" >Message</label>
                            <textarea id="message" name="message"class="form-control" rows="5" placeholder="Votre message" required></textarea>
                           
                        </div>
                        <button type="submit" id="submit" class="btn btn-info">Envoyer</button>
                        <div id="msgSubmit" class="h3 text-center hidden"></div>
                        <div class="control-label" id="statusmsg"></div>
                    </form>
                    
                    </div>
                </div>
                </div>
    </section>
